[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codedcompute"
version = "0.5.0"
description = "NumPy coded-computation simulation and Hydra experiment pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
lint = ["ruff>=0.11"]

[tool.ruff]
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codedcompute*"]
